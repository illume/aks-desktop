name: Headlamp main compatibility

on:
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: headlamp-main-compatibility
  cancel-in-progress: true

env:
  NODE_VERSION: "22.22.2"

jobs:
  compatibility:
    name: Build AKS Desktop with Headlamp main
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout AKS Desktop
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Checkout Headlamp main
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          repository: kubernetes-sigs/headlamp
          ref: main
          path: .headlamp-main
          persist-credentials: false

      - name: Resolve Headlamp commit
        id: headlamp
        shell: bash
        run: echo "commit=$(git -C .headlamp-main rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install pinned dependencies
        run: |
          source build/setup-npm.sh
          npm ci

      - name: Prepare source package from Headlamp main
        run: npm run headlamp:source -- --source .headlamp-main --commit "${{ steps.headlamp.outputs.commit }}"

      - name: Apply the AKS Desktop patch
        run: rm -rf node_modules && npm ci

      - name: Verify package and build contracts
        run: npm run test:headlamp-patches && npm run test:build

      - name: Build unpacked AKS Desktop
        run: npm run build:unpacked

      - name: Type-check Headlamp
        run: npm --prefix node_modules/@headlamp-k8s/headlamp-source run tsc

      - name: Lint Headlamp frontend and app
        run: |
          npm --prefix node_modules/@headlamp-k8s/headlamp-source/source run frontend:lint
          npm --prefix node_modules/@headlamp-k8s/headlamp-source/source run app:lint

      - name: Smoke-test the packaged application
        run: npm run test:distribution -- --no-sandbox
